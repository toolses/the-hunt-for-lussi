<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- iPad / iOS fullskjerm som hjem-app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jakten på Lussi" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <title>Jakten på Lussi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #1a1a2e;
      overflow: hidden;
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
      position: fixed;
      top: 0;
      left: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas {
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Roter-melding når iPad holdes i portrett */
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a1a2e;
      color: #fff;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      text-align: center;
      gap: 16px;
    }
    #rotate-msg .icon {
      font-size: 64px;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    #rotate-msg p { font-size: 20px; color: #ccc; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%  { transform: rotate(-20deg); }
      75%  { transform: rotate( 20deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-msg { display: flex; }
      canvas { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="rotate-msg">
    <div class="icon">📱</div>
    <p>Snu iPaden sidelengs<br>for å spille!</p>
  </div>

  <!-- Kaplay v3 game engine -->
  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>

  <!-- Game modules (load order matters) -->
  <script src="js/init.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/dialogue.js"></script>

  <!-- Scenes -->
  <script src="js/scenes/start.js"></script>
  <script src="js/scenes/gang.js"></script>
  <script src="js/scenes/ylva.js"></script>
  <script src="js/scenes/vetle.js"></script>
  <script src="js/scenes/bad.js"></script>
  <script src="js/scenes/stue.js"></script>
  <script src="js/scenes/mamma.js"></script>
  <script src="js/scenes/kjokken.js"></script>
  <script src="js/scenes/gata.js"></script>
  <script src="js/scenes/vinn.js"></script>
  <script src="js/scenes/dev_tool.js"></script>

  <!-- Start the game -->
  <script src="js/main.js"></script>
</body>
</html>
